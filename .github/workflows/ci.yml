name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust init and Moonhead utilities
        run: cargo check --manifest-path moonhead-init/Cargo.toml --all-targets

      - name: Run clippy lints
        run: cargo clippy --manifest-path moonhead-init/Cargo.toml --all-targets -- -D warnings

      - name: Lint shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck cryptsetup-bin
          shellcheck scripts/*.sh tests/*.sh

      - name: Test signed A/B update flow
        run: tests/test-update-flow.sh