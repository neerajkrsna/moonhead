[package]
name = "coreos-pid1"
version = "0.3.0"
edition = "2021"
description = "Memory-safe Rust PID 1 supervisor with PSI watchdog, Netlink Netplan, eBPF LSM, and Landlock sandboxing"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["signal", "mount", "sched", "process", "reboot", "fs", "event", "hostname"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "CORE-OS Engineering <dev@coreos.local>"
section = "admin"
priority = "required"
provides = "init, systemd-sysv, linux-initramfs-tool"
conflicts = "systemd, systemd-sysv, sysvinit-core"
replaces = "systemd-sysv"
depends = "$auto"
assets = [
    ["target/release/coreos-pid1", "sbin/coreos-pid1", "755"],
    ["target/release/service", "usr/local/sbin/service", "755"],
    ["target/release/journalctl", "usr/local/bin/journalctl", "755"],
    ["target/release/netplan", "usr/local/sbin/netplan", "755"],
    ["target/release/core-jail", "usr/local/bin/core-jail", "755"],
    ["../build/arm64/ebpf/io_uring_lsm.bpf.o", "usr/lib/coreos/io_uring_lsm.bpf.o", "644"],
    ["services/console.toml", "etc/coreos/services/console.toml", "644"],
    ["netplan/01-default.yaml", "etc/netplan/01-default.yaml", "644"],
]
